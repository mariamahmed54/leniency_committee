<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leniency Committee</title>
  <link id="bootstrapCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="page-header py-4 mb-4">
    <div class="container d-flex justify-content-between align-items-start gap-3">
      <div>
        <h1 class="h3 mb-1" data-i18n="pageTitle">Leniency Committee</h1>
        <p class="mb-0" data-i18n="pageSubtitle">Register students, then review the ones who narrowly missed passing.</p>
      </div>
      <button type="button" id="langBtn" class="btn btn-sm btn-outline-light text-nowrap">العربية</button>
    </div>
  </header>

  <main class="container pb-5">
    <div class="row g-4">

      <section class="col-lg-5">
        <div class="card panel">
          <div class="card-body">
            <h2 class="h5 mb-3" data-i18n="studentDetails">Student details</h2>

            <div class="mb-3">
              <label for="studentName" class="form-label" data-i18n="label_name">Name</label>
              <input type="text" id="studentName" class="form-control" data-i18n-placeholder="namePlaceholder" placeholder="Full name">
            </div>

            <div class="row g-3 mb-3">
              <div class="col-12 col-sm-4">
                <label for="grade1" class="form-label" data-i18n="label_grade1">Subject 1</label>
                <input type="number" id="grade1" class="form-control" min="0" max="100">
              </div>
              <div class="col-12 col-sm-4">
                <label for="grade2" class="form-label" data-i18n="label_grade2">Subject 2</label>
                <input type="number" id="grade2" class="form-control" min="0" max="100">
              </div>
              <div class="col-12 col-sm-4">
                <label for="grade3" class="form-label" data-i18n="label_grade3">Subject 3</label>
                <input type="number" id="grade3" class="form-control" min="0" max="100">
              </div>
            </div>

            <div class="mb-3">
              <label for="attendance" class="form-label" data-i18n="label_attendance">Attendance (%)</label>
              <input type="number" id="attendance" class="form-control" min="0" max="100">
            </div>

            <div id="errorBox" class="text-danger mb-3" role="alert"></div>

            <div class="d-grid gap-2">
              <button type="button" id="addBtn" class="btn btn-primary" data-i18n="btnAdd">Add Student</button>
              <button type="button" id="committeeBtn" class="btn btn-outline-dark" data-i18n="btnCommittee">Activate Leniency Committee</button>
            </div>
          </div>
        </div>
      </section>

      <section class="col-lg-7">
        <div class="card panel mb-4">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h5 mb-0" data-i18n="registeredStudents">Registered students</h2>
              <button type="button" id="clearBtn" class="btn btn-sm btn-outline-secondary" data-i18n="btnClear">Clear all</button>
            </div>
            <div id="studentsBox"></div>
          </div>
        </div>

        <div class="card panel">
          <div class="card-body">
            <h2 class="h5 mb-3" data-i18n="finalReport">Final report</h2>
            <div id="reportBox"></div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
